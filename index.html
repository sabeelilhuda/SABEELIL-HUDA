<label>${lab}<input id="id" autocomplete="username" placeholder="SH0002 or SH0002@sabeelilhuda.com"></label><label>Password<input id="pw" type="password" autocomplete="current-password">

<label><input type="checkbox" id="sh" style="width:auto"> Show password</label><p class="err" id="er"></p><button class="p" id="go">Login</button>
<p><a href="#" id="fg">Forgot password?</a></p></div>`);
wirePub();if(note)$('#er').textContent=note;
$('#fg').onclick=async e=>{e.preventDefault();const v=$('#id').value.trim().toLowerCase();if(CONFIGURED&&v.includes('@')&&!v.endsWith('@'+EMAIL_DOMAIN)){

}catch(x){$('#er').textContent='Could not send the reset link ('+(x.code||x.message)+').';}}else $('#er').textContent='Enter your real email above to get a reset link. Students and teachers: ask the school Admin to reset your password.';
};
$('#go').onclick=async()=>{if(!CONFIGURED)return $('#er').textContent='Firebase is not connected yet. Paste firebaseConfig at the top of index.html.';
if(Date.now()<lockUntil)return $('#er').textContent="Too many attempts. Wait 5 minutes.";
try{
  const raw=$('#id').value.trim(), pwd=$('#pw').value;
  if(!raw||!pwd) return $('#er').textContent='Enter your ID or email and password.';
  const lower=raw.toLowerCase();
  let cand=[];
  if(raw.includes('@')){
    cand=[raw, lower];
  } else {
    // Pure ID login (Student SH0001 / Teacher TCH0001)
    const id=lower.replace(/\s+/g,'');
    cand=[
      id+'@'+EMAIL_DOMAIN,
      id+'@sms.portal',
      raw+'@'+EMAIL_DOMAIN,
      id.toUpperCase()+'@'+EMAIL_DOMAIN
    ];
    // also try common prefix variants
    if(id.startsWith('sh')||id.startsWith('tch')||id.startsWith('adm')){
      cand.push(id+'@sabeelilhuda.com');
    }

  cand=[...new Set(cand.filter(Boolean))];
  let ok=false, le;
  for(const em of cand){
    try{
      await signInWithEmailAndPassword(auth,em,pwd);
      ok=true; break;
    }catch(e2){ le=e2; }
  }

  tries=0;

}

async function getApplicableFeeItems(){
  const sess=S.session||'', term=S.term||'', cl=me.classId||'', secs=me.sections||[];
  const q=await getDocs(collection(db,'feeItems'));
  return q.docs.map(d=>({id:d.id,...d.data()})).filter(f=>{
    if(f.active===false) return false;
    if(f.classId && f.classId!==cl) return false;
    if(f.session && sess && f.session!==sess) return false;
    if(f.term && term && f.term!==term) return false;
    if(f.sections && f.sections.length){
      if(!secs.some(s=>f.sections.includes(s))) return false;
    }
    return true;
  }).sort((a,b)=>(a.title||'').localeCompare(b.title||''));
}
async function getMyPayments(feeItemId){
  let q=query(collection(db,'payments'),where('studentUid','==',me.uid));
  if(feeItemId) q=query(q,where('feeItemId','==',feeItemId));
  const snap=await getDocs(q);
  return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
}
async function studentFees(){
  V(`<div class="box"><h2>School Fees & Payments</h2>

  <button class="p" data-f="stat">Payment Status</button>
  <div id="feesub" style="margin-top:14px"></div></div>`);
  const go=async t=>{
    const sub=$('#feesub');
    if(t==='my'){
      sub.innerHTML='<p>Loading fees...</p>';
      try{
        const items=await getApplicableFeeItems();
        const pays=await getMyPayments();
        if(!items.length){sub.innerHTML='<p>No fees have been published for your class/section/session yet. Contact the Admin.</p>';return;}
        let html=`<h3>My Fees — ${esc(S.session)} ${esc(S.term)}</h3>
        <p><b>Bank details (for payment):</b><br>${S.bankName?`Bank: ${esc(S.bankName)}<br>`:''}${S.bankAcc?`Account No: ${esc(S.bankAcc)}<br>`:''}${S.bankNameOnAcc?`Account Name: ${esc(S.bankNameOnAcc)}<br>`:''}${S.bankNote?esc(S.bankNote):''}</p>
        <table><tr><th>Fee</th><th>Amount Due</th><th>Paid (Approved)</th><th>Outstanding</th><th>Status</th></tr>`;
        for(const f of items){
          const approved=pays.filter(p=>p.feeItemId===f.id && p.status==='approved');
          const paid=approved.reduce((s,p)=>s+(+p.amount||0),0);
          const due=+f.amount||0;
          const out=Math.max(0,due-paid);
          const pending=pays.some(p=>p.feeItemId===f.id && p.status==='pending');
          let st='UNPAID';
          if(paid>=due && due>0) st='PAID';
          else if(paid>0) st='PARTIALLY PAID';
          if(pending) st+=' (pending receipt)';
          html+=`<tr><td>${esc(f.title)}${f.description?`<br><small>${esc(f.description)}</small>`:''}</td><td>${due.toLocaleString()}</td><td>${paid.toLocaleString()}</td><td>${out.toLocaleString()}</td><td><b>${st}</b></td></tr>`;
        }
        html+='</table><p class="err">Only approved payments reduce the outstanding balance. Pending receipts wait for Admin verification.</p>';
        sub.innerHTML=html;
      }catch(e){sub.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
    }else if(t==='up'){
      sub.innerHTML='Loading...';
      try{
        const items=await getApplicableFeeItems();
        if(!items.length){sub.innerHTML='<p>No published fees for you yet.</p>';return;}
        sub.innerHTML=`<h3>Upload Payment Receipt</h3>
        <label>Select Fee<select id="fid">${items.map(f=>`<option value="${esc(f.id)}">${esc(f.title)} (₦${(+f.amount||0).toLocaleString()})</option>`).join('')}</select></label>
        <label>Amount Paid<input id="amt" type="number" min="1" step="1" placeholder="Amount you paid"></label>

        <label>Receipt Photo / Screenshot<input type="file" id="rfile" accept="image/*"></label>
        <p class="err" id="uer"></p>
        <button class="p" id="usub">Submit for Verification</button>
        <p>After upload, status will be Pending until Admin approves or rejects it. Do not upload the same receipt twice.</p>`;
        $('#usub').onclick=async()=>{
          const fid=$('#fid').value, amt=+$('#amt').value, ref=$('#ref').value.trim(), pdt=$('#pdt').value, file=$('#rfile').files[0];
          if(!fid||!amt||amt<=0)return $('#uer').textContent='Enter a valid amount.';
          if(!ref)return $('#uer').textContent='Enter transaction reference.';
          if(!pdt)return $('#uer').textContent='Select payment date.';
          if(!file)return $('#uer').textContent='Choose a receipt image.';
          if(file.size>8e6)return $('#uer').textContent='Image too large (max ~8MB).';
          $('#uer').textContent='Uploading...';
          try{
            const item=items.find(x=>x.id===fid);
            let url='';
            try{
              const m=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js");
              const storage=m.getStorage(app);
              const path=`receipts/${me.uid}/${Date.now()}_${(file.name||'receipt').replace(/[^a-zA-Z0-9._-]/g,'_')}`;
              const r=m.ref(storage,path);
              await m.uploadBytes(r,file,{contentType:file.type||'image/jpeg'});
              url=await m.getDownloadURL(r);
            }catch(se){
              // fallback compressed data URL (still works, stored in Firestore)
              url=await shrink(file,900,false);
            }
            const docRef=doc(collection(db,'payments'));
            await setDoc(docRef,{
              studentUid:me.uid, feeItemId:fid, amount:amt, reference:ref, payDate:pdt,
              receiptURL:url, status:'pending', reason:'', submittedAt:Date.now(),
              reviewedAt:null, reviewedBy:'', studentLoginId:me.loginId||'', studentName:me.name||'',
              classId:me.classId||'', session:item.session||S.session||'', term:item.term||S.term||'',
              feeTitle:item.title||'', feeAmount:+item.amount||0
            });
            await audit('paymentSubmit', me.loginId+' '+amt);
            $('#uer').style.color='#0b6e4f';
            $('#uer').textContent='Receipt submitted successfully. Status: Pending Admin verification.';
            setTimeout(()=>go('hist'),1500);
          }catch(e){$('#uer').textContent='Upload failed: '+(e.message||e.code||e);}
        };
      }catch(e){sub.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
    }else if(t==='hist'||t==='stat'){
      sub.innerHTML='Loading history...';
      try{
        const pays=await getMyPayments();
        if(!pays.length){sub.innerHTML='<p>No payment records yet.</p>';return;}
        let html=`<h3>Payment History & Status</h3><table><tr><th>Date</th><th>Fee</th><th>Amount</th><th>Reference</th><th>Status</th><th></th></tr>`;

'Academic History':async()=>{
  const r=await rp();
  if(!r.length) return V('<div class="box"><h2>Academic History</h2><p>No published results or report cards yet.</p></div>');
  // group by session then term
  const groups={};
  r.forEach(x=>{
    const sk=x.session||'Unknown Session';
    const tk=x.term||'Unknown Term';
    groups[sk]=groups[sk]||{};
    groups[sk][tk]=groups[sk][tk]||[];
    groups[sk][tk].push(x);
  });
  let html=`<div class="box"><h2>Academic History</h2>
  <p>All published results and report cards for previous and current sessions. Select a term to view or print the official report card.</p>`;
  const sessions=Object.keys(groups).sort().reverse();
  for(const se of sessions){
    html+=`<h3 style="margin-top:16px;color:var(--green)">${esc(se)}</h3>`;
    for(const tm of Object.keys(groups[se])){
      const items=groups[se][tm];
      items.forEach((x,i)=>{
        html+=`<div class="box" style="border-left:4px solid var(--blue)">
        <p><b>${esc(tm)}</b> — Class: ${esc(x.classId||me.classId||'—')} — Average: <b>${x.average??'—'}</b> — Position: ${x.position??'—'}</p>
        <button class="p" data-hist="${se}||${tm}||${i}">View / Print Report Card</button>
        <button class="p" data-res="${se}||${tm}||${i}">View Subject Results</button>
        </div>`;
      });
    }
  }
  html+='<div id="histview"></div></div>';
  V(html);
  A.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{
    const [se,tm,i]=b.dataset.hist.split('||');
    const x=groups[se][tm][+i];
    $('#histview').innerHTML=reportHTML(me,x)+printBtn()+' '+pdfBtn();
    $('#histview').scrollIntoView({behavior:'smooth'});
  });
  A.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{
    const [se,tm,i]=b.dataset.res.split('||');
    const x=groups[se][tm][+i];
    $('#histview').innerHTML=`<div class="box"><h3>${esc(se)} ${esc(tm)} — Average ${x.average}</h3>
    <table><tr><th>Subject</th><th>C.A</th><th>Exam</th><th>Total</th><th>Grade</th><th>Remark</th></tr>
    ${(x.rows||[]).map(y=>`<tr><td>${esc(y.subject)}</td><td>${y.ca}</td><td>${y.exam}</td><td>${y.total}</td><td>${y.grade}</td><td>${esc(y.remark)}</td></tr>`).join('')}
    </table></div>`;
    $('#histview').scrollIntoView({behavior:'smooth'});
  });
},

async function teacherPerformance(){
  V(`<div class="box"><h2>Student Performance (my classes)</h2>
  <p>Summary of published report averages for classes you teach. Detailed reports are under the Reports tab.</p>
  <div id="tperf">Loading...</div></div>`);
  try{
    const cls=me.classes||[];
    if(!cls.length){ $('#tperf').innerHTML='<p>No classes assigned.</p>'; return; }
    const snaps=await Promise.all(cls.map(cl=>getDocs(query(collection(db,'reports'),where('classId','==',cl)))));
    let html='';
    cls.forEach((cl,i)=>{
      const rows=snaps[i].docs.map(d=>d.data());
      if(!rows.length){ html+=`<p><b>${esc(cl)}</b>: No published reports yet.</p>`; return; }
      const avgs=rows.map(r=>+r.average||0);
      const avg=(avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(1);
      const hi=Math.max(...avgs), lo=Math.min(...avgs);
      html+=`<div class="stat" style="margin-bottom:10px"><h3>${esc(cl)}</h3>
      <p>Students with reports: ${rows.length} | Class average: <b>${avg}</b> | Highest: ${hi} | Lowest: ${lo}</p></div>`;
    });
    $('#tperf').innerHTML=html||'<p>No data.</p>';
  }catch(e){ $('#tperf').innerHTML=`<p class="err">${esc(e.message)}</p>`; }
}
