<style>
:root{
  --green:#0b6e4f;
  --green-dark:#095c42;
  --blue:#1f7ae0;
  --orange:#FFA51E;
  --sidebar-green:#12A510;
  --sidebar-green-dark:#0e8a0d;
  --sidebar-orange:#FFA51E;
  --sidebar-w:240px;
  --header-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:#f4f6f5;color:#222;line-height:1.55;min-height:100vh}
a{color:var(--green)}
button,input,select,textarea{font:inherit}

/* Top thin bar */
.top-contact-bar{background:var(--green-dark);color:#fff;padding:5px 12px;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.top-contact-info span{margin-right:12px}

/* Header */
.main-header{background:var(--green);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;text-align:center;border-bottom:4px solid var(--blue)}
.header-logo{width:56px;height:56px;border-radius:50%;background:#e8e8e8;border:2px solid #fff;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#777}
.header-logo img{width:100%;height:100%;object-fit:cover}
.header-title-box{flex-grow:1;padding:0 8px}
.header-title-ar{font-size:18px;font-weight:bold;direction:rtl;margin-bottom:2px}
.header-title-en{font-size:14px;font-weight:bold;letter-spacing:.3px}
.header-sub{font-size:10px;opacity:.9;margin-top:1px}

/* Layout with sidebar */
.app-layout{display:flex;min-height:calc(100vh - 120px);position:relative}
.sidebar{
  width:var(--sidebar-w);background:var(--sidebar-green);color:#fff;flex-shrink:0;
  display:flex;flex-direction:column;overflow-y:auto;max-height:calc(100vh - 100px);
  position:sticky;top:0;z-index:40;
  transition:transform .25s ease, width .25s ease;
}
.sidebar-brand{padding:12px 14px;font-weight:bold;font-size:13px;border-bottom:1px solid rgba(255,255,255,.2);background:var(--sidebar-green-dark)}
.sidebar-nav{flex:1;padding:6px 0}
.sidebar-nav a,.sidebar-nav button{
  display:block;width:100%;text-align:left;padding:10px 14px;color:#fff;background:none;border:0;
  border-bottom:1px solid rgba(255,255,255,.08);font:bold 12.5px Arial,sans-serif;
  text-transform:none;cursor:pointer;text-decoration:none;line-height:1.3;
}
.sidebar-nav a:hover,.sidebar-nav button:hover,
.sidebar-nav a.active,.sidebar-nav button.active{background:var(--sidebar-orange);color:#fff}
.sidebar-nav .menu-group-title{
  display:block;padding:8px 14px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
  opacity:.75;font-weight:bold;margin-top:4px;
}
.sidebar-footer{padding:10px 14px;border-top:1px solid rgba(255,255,255,.2);font-size:11px}
.sidebar-footer button{width:100%;background:var(--sidebar-orange);color:#fff;border:0;padding:9px;border-radius:4px;font-weight:bold;cursor:pointer}
.sidebar-footer button:hover{background:#e89400}

/* Mobile sidebar toggle */
.sidebar-toggle{
  display:none;position:fixed;bottom:18px;left:14px;z-index:60;
  background:var(--sidebar-orange);color:#fff;border:0;width:48px;height:48px;border-radius:50%;
  font-size:22px;box-shadow:0 3px 12px rgba(0,0,0,.3);cursor:pointer;
}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.sidebar-overlay.open{display:block}

.main-content{flex:1;min-width:0;padding:12px 14px 40px}
.container{max-width:1100px;margin:0 auto;padding:0 8px}

/* Boxes & forms */
.box{background:#fff;border-radius:8px;padding:16px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #e5e8e6}
.box.err{border-color:#b00020}
h2{color:var(--green);margin-bottom:10px;padding-bottom:5px;border-bottom:3px solid var(--green);text-transform:uppercase;font-size:16px}
h3,h4{color:var(--green-dark);margin:8px 0}
p{margin:5px 0}
label{display:block;font-weight:bold;font-size:12.5px;margin-top:4px}
input,select,textarea{width:100%;padding:9px 10px;margin:3px 0 10px;border:1px solid #ccc;border-radius:5px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);border-color:var(--orange)}
button.p{background:var(--green);color:#fff;border:0;padding:9px 16px;border-radius:5px;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}
button.p:hover{background:var(--green-dark)}
button.p:focus-visible,input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--orange)}
td button,li button{background:#d9534f;color:#fff;border:0;padding:4px 9px;border-radius:4px;cursor:pointer;font-size:11.5px;margin:2px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
td,th{border:1px solid #ddd;padding:7px;text-align:left}
th{background:var(--green);color:#fff}
tr:nth-child(even){background:#f7faf7}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:#e8f8e8;padding:12px;border-left:4px solid var(--green);border-radius:0 6px 6px 0}
.stat p{font-size:20px;font-weight:bold}
.err{color:#b00020}
.ar{direction:rtl;text-align:right}

/* Report sheets */
.sheet{background:#fff;border:5px solid var(--green);padding:16px;margin:10px 0}
.sheet h2{border:0;margin:4px 0;text-transform:none}
.sheet h3{text-align:center;margin:4px;color:#000}
.sheet td,.sheet th{border:1px solid #555;background:none;color:#000}
.sheet tr:nth-child(even){background:none}

/* Footer */
.footer-main{background:var(--green);color:#fff;padding:20px 16px 10px;margin-top:24px}
.footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:1100px;margin:0 auto}
.footer-main h4{color:#fff;border-bottom:2px solid var(--blue);display:inline-block;margin-bottom:6px;text-transform:uppercase;font-size:13px}
.footer-bottom{text-align:center;margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2);font-size:11px;opacity:.85}

/* Login page polish */
.login-wrap{max-width:400px;margin:24px auto}
.login-wrap .box{border-top:4px solid var(--green);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.login-wrap h2{text-align:center;border:0;padding:0;margin-bottom:8px}
.login-wrap p{text-align:center;font-size:13px;color:#555}

/* Public old nav (kept for fallback, hidden when sidebar used) */
.nav-toggle-bar{display:none}
.public-dropdown-panel{display:none}

/* Responsive */
@media(max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;max-height:100vh;z-index:50;
    transform:translateX(-105%);box-shadow:4px 0 20px rgba(0,0,0,.2);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:flex;align-items:center;justify-content:center}
  .header-title-ar{font-size:14px}
  .header-title-en{font-size:11px}
  .header-sub{font-size:9px}
  .header-logo{width:44px;height:44px}
  .main-content{padding:10px 10px 70px}
  .box table{display:block;overflow-x:auto}
}
@media(min-width:901px){
  .sidebar-toggle{display:none !important}
  .sidebar-overlay{display:none !important}
}
@media print{
  .noprint,.top-contact-bar,.main-header,.sidebar,.sidebar-toggle,.sidebar-overlay,.footer-main{display:none !important}
  body{background:#fff}
  .main-content,.container{margin:0;padding:0;max-width:none}
  .box{border:0;box-shadow:none;padding:0}
  .sheet{page-break-after:always;border:5px solid var(--green)}
  .app-layout{display:block}
}
</style></head><body>

  if(!raw||!pwd) return $('#er').textContent='Enter your ID or email and password.';
  const lower=raw.toLowerCase();

    ];

async function getApplicableFeeItems(){
  const sess=S.session||'', term=S.term||'', cl=me.classId||'', secs=me.sections||[];
  const q=await getDocs(collection(db,'feeItems'));
  return q.docs.map(d=>({id:d.id,...d.data()})).filter(f=>{
    if(f.active===false) return false;
    if(f.classId && f.classId!==cl) return false;
    if(f.session && sess && f.session!==sess) return false;
    if(f.term && term && f.term!==term) return false;
    if(f.sections && f.sections.length){
      if(!secs.some(s=>f.sections.includes(s))) return false;
    }
    return true;
  }).sort((a,b)=>(a.title||'').localeCompare(b.title||''));
}
async function getMyPayments(feeItemId){

}

        let html=`<h3>Payment History & Status</h3><table><tr><th>Date</th><th>Fee</th><th>Amount</th><th>Reference</th><th>Status</th><th></th></tr>`;
        for(const p of pays){
          const st=p.status||'pending';
          const col=st==='approved'?'#0b6e4f':st==='rejected'?'#b00020':'#b8860b';
          html+=`<tr><td>${esc(p.payDate||fmt(p.submittedAt))}</td><td>${esc(p.feeTitle)}</td><td>${(+p.amount||0).toLocaleString()}</td><td>${esc(p.reference)}</td><td style="color:${col};font-weight:bold">${esc(st.toUpperCase())}${p.reason?' — '+esc(p.reason):''}</td>

        }
        html+='</table><div id="rprev"></div>';
        sub.innerHTML=html;
        A.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
          const p=pays.find(x=>x.id===b.dataset.v);
          if(!p)return;
          $('#rprev').innerHTML=`<div class="box"><h3>Receipt Image</h3><img src="${esc(p.receiptURL)}" alt="Receipt" style="max-width:100%;border:1px solid #ccc"><p>Ref: ${esc(p.reference)} | Amount: ${(+p.amount||0).toLocaleString()} | Status: ${esc(p.status)}</p><button class="p" onclick="$('#rprev').innerHTML=''">Close</button></div>`;
        });
        A.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{
          const p=pays.find(x=>x.id===b.dataset.pr);

async function aGraduated(){

        <button data-gv="${u.id}">View Records</button>
        <button data-gr="${u.id}" style="background:#0b6e4f">Restore to Active</button>

      <button class="p" onclick="$('#gv').innerHTML=''">Close</button></div>`;
    });
    A.querySelectorAll('[data-gr]').forEach(b=>b.onclick=async()=>{
      const u=map[b.dataset.gr];

      try{

async function aFees(){
  // Bank details + Fee items + Pending receipts verification + Summary
  V(`<div class="box"><h2>22. FEES & PAYMENTS</h2>
  <button class="p" data-af="bank">Bank Account Details</button>
  <button class="p" data-af="items">Set / Publish Fees by Class</button>
  <button class="p" data-af="pending">Verify Receipts (Pending)</button>
  <button class="p" data-af="all">All Payments</button>
  <button class="p" data-af="legacy">Legacy Fee Announcements</button>
  <div id="afeesub" style="margin-top:14px"></div></div>`);
  const sub=$('#afeesub');
  const render=async mode=>{
    if(mode==='bank'){
      sub.innerHTML=`<h3>School Bank Account Details</h3>
      <p>Students will see these details when viewing My Fees and before uploading a receipt.</p>
      <label>Bank Name<input id="bn" value="${esc(S.bankName||'')}"></label>
      <label>Account Number<input id="ba" value="${esc(S.bankAcc||'')}"></label>
      <label>Account Name<input id="bna" value="${esc(S.bankNameOnAcc||'')}"></label>
      <label>Extra instructions / note<textarea id="bnote" rows="3">${esc(S.bankNote||'')}</textarea></label>
      <button class="p" id="bsv">Save Bank Details</button><p id="ber"></p>`;
      $('#bsv').onclick=async()=>{
        try{
          const n={bankName:$('#bn').value.trim(),bankAcc:$('#ba').value.trim(),bankNameOnAcc:$('#bna').value.trim(),bankNote:$('#bnote').value.trim()};
          await setDoc(doc(db,'settings/school'),n,{merge:true});
          Object.assign(S,n);Object.assign(SDOC,n);
          await audit('bankDetails');
          $('#ber').style.color='#0b6e4f';$('#ber').textContent='Saved.';
        }catch(e){$('#ber').textContent=e.message;}
      };
    }else if(mode==='items'){
      sub.innerHTML='Loading fee items...';
      try{
        const snap=await getDocs(collection(db,'feeItems'));
        const items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.at||0)-(a.at||0)));
        const secs=(S.sections||[]).filter(x=>x.active!==false);
        sub.innerHTML=`<h3>Set Fees by Class / Section / Session / Term</h3>
        <p>Create a fee item and it becomes visible to matching students. Leave Sections empty = all sections of that class.</p>
        <label>Title / Description of fee<input id="ft" placeholder="e.g. School Fees - First Term"></label>
        <label>Amount (₦)<input id="fam" type="number" min="0" step="1"></label>
        <label>Class<select id="fcl"><option value="">— select —</option>${lines(S.classes).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
        <label>Sections (optional, multi)<select id="fsec" multiple size="3">${secs.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>
        <label>Session<input id="fse" value="${esc(S.session)}" list="dl_ses"></label>
        <label>Term<input id="ftm" value="${esc(S.term)}" list="dl_trm"></label>
        <label>Extra note<textarea id="fdesc" rows="2"></textarea></label>
        <label><input type="checkbox" id="fact" checked style="width:auto"> Active (published to students)</label>
        <button class="p" id="fadd">Add / Publish Fee</button><p id="fer"></p>
        <h4>Existing fee items</h4>
        <table id="fit"><tr><th>Title</th><th>Class</th><th>Session/Term</th><th>Amount</th><th>Active</th><th></th></tr>
        ${items.map(f=>`<tr><td>${esc(f.title)}</td><td>${esc(f.classId)}</td><td>${esc(f.session)} ${esc(f.term)}</td><td>${(+f.amount||0).toLocaleString()}</td><td>${f.active!==false?'Yes':'No'}</td>
        <td><button data-tog="${f.id}" data-on="${f.active===false?1:0}">${f.active===false?'Activate':'Deactivate'}</button> <button data-del="${f.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">None yet</td></tr>'}
        </table>`;
        $('#fadd').onclick=async()=>{
          const title=$('#ft').value.trim(), amount=+$('#fam').value, classId=$('#fcl').value, session=$('#fse').value.trim(), term=$('#ftm').value.trim(), description=$('#fdesc').value.trim(), active=$('#fact').checked;
          const sections=[...$('#fsec').selectedOptions].map(o=>o.value);
          if(!title||!classId||!(amount>=0))return $('#fer').textContent='Title, class and amount are required.';
          try{
            await setDoc(doc(collection(db,'feeItems')),{title,amount,classId,sections,session,term,description,active,by:me.uid,at:Date.now()});
            await audit('addFeeItem',title+' '+classId);
            $('#fer').style.color='#0b6e4f';$('#fer').textContent='Fee published.';
            render('items');
          }catch(e){$('#fer').textContent=e.message;}
        };
        A.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{
          try{await updateDoc(doc(db,'feeItems',b.dataset.tog),{active:b.dataset.on==='1'});render('items');}catch(e){alert(e.message);}
        });
        A.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
          if(!confirm('Delete this fee item? Existing payments remain.'))return;
          try{await deleteDoc(doc(db,'feeItems',b.dataset.del));await audit('delFeeItem',b.dataset.del);render('items');}catch(e){alert(e.message);}
        });
      }catch(e){sub.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
    }else if(mode==='pending'||mode==='all'){
      sub.innerHTML='Loading payments...';
      try{
        let q=collection(db,'payments');
        if(mode==='pending') q=query(q,where('status','==','pending'));
        const snap=await getDocs(q);
        const pays=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
        if(!pays.length){sub.innerHTML=`<p>No ${mode==='pending'?'pending receipts':'payments'} found.</p>`;return;}
        let html=`<h3>${mode==='pending'?'Pending Receipts — Verify':'All Payments'}</h3>
        <table><tr><th>Submitted</th><th>Student</th><th>Fee</th><th>Amount</th><th>Ref</th><th>Status</th><th></th></tr>`;
        for(const p of pays){
          const col=p.status==='approved'?'#0b6e4f':p.status==='rejected'?'#b00020':'#b8860b';
          html+=`<tr><td>${esc(fmt(p.submittedAt))}</td><td>${esc(p.studentName)} (${esc(p.studentLoginId)})<br><small>${esc(p.classId)}</small></td>
          <td>${esc(p.feeTitle)}</td><td>${(+p.amount||0).toLocaleString()}</td><td>${esc(p.reference)}</td>
          <td style="color:${col};font-weight:bold">${esc((p.status||'').toUpperCase())}${p.reason?'<br><small>'+esc(p.reason)+'</small>':''}</td>
          <td><button data-view="${p.id}">View Receipt</button>
          ${p.status==='pending'?` <button data-ok="${p.id}">Approve</button> <button data-no="${p.id}">Reject</button>`:''}</td></tr>`;
        }
        html+='</table><div id="aprev"></div>';
        sub.innerHTML=html;
        const map=Object.fromEntries(pays.map(p=>[p.id,p]));
        A.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
          const p=map[b.dataset.view];
          $('#aprev').innerHTML=`<div class="box"><h3>Receipt — ${esc(p.studentName)}</h3>
          <img src="${esc(p.receiptURL)}" alt="Receipt" style="max-width:100%;max-height:70vh;border:1px solid #ccc">
          <p>Amount: ₦${(+p.amount||0).toLocaleString()} | Ref: ${esc(p.reference)} | Date: ${esc(p.payDate)}</p>
          <button class="p" onclick="$('#aprev').innerHTML=''">Close</button></div>`;
        });
        A.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
          if(!confirm('Approve this payment? It will update the student balance.'))return;
          try{
            const ref=doc(db,'payments',b.dataset.ok);
            const cur=await getDoc(ref);
            if(!cur.exists()||cur.data().status!=='pending')throw Error('Already processed or missing.');
            await updateDoc(ref,{status:'approved',reviewedAt:Date.now(),reviewedBy:me.uid,reason:''});
            await audit('paymentApprove',b.dataset.ok);
            alert('Approved. Student balance will reflect this payment.');
            render(mode);
          }catch(e){alert(e.message);}
        });
        A.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
          const reason=prompt('Reason for rejection (shown to student):','Invalid or unclear receipt');
          if(reason===null)return;
          try{
            const ref=doc(db,'payments',b.dataset.no);
            const cur=await getDoc(ref);
            if(!cur.exists()||cur.data().status!=='pending')throw Error('Already processed or missing.');
            await updateDoc(ref,{status:'rejected',reviewedAt:Date.now(),reviewedBy:me.uid,reason:reason||'Rejected'});
            await audit('paymentReject',b.dataset.no);
            alert('Rejected.');
            render(mode);
          }catch(e){alert(e.message);}
        });
      }catch(e){sub.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
    }else if(mode==='legacy'){
      // keep original content-based fees announcements
      await cm(['fee'],'Legacy Fee Announcements (categories & notes)');
      // also summary from structured
      try{
        const [fi,pay]=await Promise.all([getDocs(collection(db,'feeItems')),getDocs(collection(db,'payments'))]);
        let totalDue=0, totalApproved=0;
        fi.forEach(d=>{if(d.data().active!==false)totalDue+=(+d.data().amount||0);}); // rough
        pay.forEach(d=>{if(d.data().status==='approved')totalApproved+=(+d.data().amount||0);});
        $('#v').insertAdjacentHTML('beforeend',`<div class="box"><b>Structured fees summary:</b> Published fee items: ${fi.size} | Total approved payments collected: ₦${totalApproved.toLocaleString()}</div>`);
      }catch(e){}
    }
  };
  A.querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>render(b.dataset.af));
  render('pending');
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const audit=(action,detail='')=>{if(!db)return;setDoc(doc(collection(db,'audit')),{by:me?.uid||'',action,detail:String(detail),
at:Date.now()}).catch(()=>{});};
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';return [...crypto.getRandomValues(new Uint8Array(8))].map(x=>c[x%c.length]).join('')+'A7';
};
const wb=async ops=>{for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(f=>f(b));
await b.commit();}};
const gscale=()=>{const g=lines(S.grading).map(l=>{const m=l.match(/^([A-Za-z]+)\s*=\s*(\d+)\s*-\s*(\d+)/);return m&&{
g:m[1].toUpperCase(),lo:+m[2]};}).filter(Boolean).sort((a,b)=>b.lo-a.lo);return g.length?g:[{g:'A',lo:70},{g:'B',
lo:60},{g:'C',lo:50},{g:'D',lo:45},{g:'E',lo:40},{g:'F',lo:0}];};
const grade=t=>(gscale().find(x=>t>=x.lo)||{g:'F'}).g;
const remark=t=>({A:'Excellent',B:'Very Good',C:'Good',D:'Fair',E:'Pass',F:'Fail'}[grade(t)]||'');
async function makeAccount(d){const role=d.role,pre=PREFIX[role];if(!pre||!d.name)throw Error('Name is required');

if(role==='admin'&&me.role!=='superadmin')throw Error('Only the Super Admin can create admins');if(role==='admin'&&!d.email)throw Error('Email is required');

const n=await runTransaction(db,async t=>{const r=doc(db,'meta','counters'),x=await t.get(r),v=((x.data()||{})[role]||0)+1;
t.set(r,{[role]:v},{merge:true});return v;});
const loginId=pre+String(n).padStart(4,'0'),email=(d.email||loginId.toLowerCase()+'@'+EMAIL_DOMAIN).toLowerCase(),
pw=d.pw==='random'?genPw():(d.pw||DEFAULT_PW[0]),sa=getAuth(sec),tc=d.teaching||[];
const c=await createUserWithEmailAndPassword(sa,email,pw);await signOut(sa);
await setDoc(doc(db,'users',c.user.uid),{role,loginId,email,name:d.name,classId:d.classId||'',subjects:d.subjects||[],
teaching:tc,classes:[...new Set(tc.map(x=>x.split('|')[0]))],bio:d.bio||{},sections:d.sections||[],status:'Active',session:d.session||'',term:d.term||'',active:true,mustChange:true,createdAt:Date.now()}
);
await audit('createAccount',loginId);return {loginId,email,tempPassword:pw,uid:c.user.uid};}
async function resetPw(uid){const p=prompt('New temporary password for this user (minimum 6 characters).\nThe user must choose a permanent password at the next login.','123456');if(p===null)return;if(p.length<6)return alert('The password must be at least 6 characters.');
try{const r=await call('resetPassword',{uid,pw:p});alert('Password reset.\nNew temporary password: '+r.tempPassword+'\nGive it to the user. He/she must set a permanent password at the next login.');}
catch(e){const c=e.code||'';alert(c==='functions/not-found'||c==='functions/internal'||c==='functions/unavailable'?'Password reset is not set up yet. The resetPassword Cloud Function must be deployed (Firebase Blaze plan).':'Could not reset the password: '+(e.message||c));}}
const shrink=(f,max,png)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;
c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL(png?'image/png':'image/jpeg',.75));};i.onerror=rej;
i.src=r.result;};r.onerror=rej;r.readAsDataURL(f);});
async function img(f,max,tag){if(CONFIGURED&&f.size<2e6&&/^image\/(png|jpeg|webp)$/.test(f.type)){try{const m=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"),
r=m.ref(m.getStorage(app),'public/'+tag+'_'+Date.now());await Promise.race([m.uploadBytes(r,f),sleep(8000).then(()=>{
throw Error('t');})]);return await m.getDownloadURL(r);}catch(e){}}return shrink(f,max,tag!=='g');}
const rq=d=>query(collection(db,'results'),where('session','==',d.session),where('term','==',d.term),where('classId',
'==',d.classId));
async function review(d){const to={approve:'approved',return:'returned',reopen:'returned'}[d.action],ok=d.action==='reopen'?['published',
'approved','submitted']:['submitted'];
const q=await getDocs(rq(d));await wb(q.docs.filter(x=>ok.includes(x.data().status)).map(x=>b=>b.update(x.ref,
{status:to})));await audit('results:'+d.action,[d.session,d.term,d.classId].join('/'));return {ok:true};}
async function promote(f,t){const L=lines(S.classes);if(!f||!t)throw Error('Enter both classes');if(!L.includes(f)||!L.includes(t))throw Error('Use existing class names (see 7. CLASS MANAGEMENT).');const q=await getDocs(query(collection(db,'users'),where('role','==','student'),where('classId','==',f))),act=q.docs.filter(x=>statusOf(x.data())==='Active');
await moveStudents(act.map(x=>({id:x.id,classId:f})),t,'promote');return {count:act.length};}
async function publish(d){const sid=d.session.replace('/','-'),[q,uq]=await Promise.all([getDocs(rq(d)),getDocs(query(collection(db,
'users'),where('role','==','student'),where('classId','==',d.classId)))]),docs=q.docs;
if(!docs.length)throw Error('No results found');if(docs.some(x=>!['approved','published'].includes(x.data().status)))throw Error('Some results are not approved');

const have=new Set(docs.map(x=>x.data().studentUid+'|'+x.data().subject)),miss=[];uq.docs.forEach(u=>(u.data().subjects||[]).forEach(s=>{
if(!have.has(u.id+'|'+s))miss.push(u.data().name+' - '+s);}));
if(miss.length)throw Error('Missing marks: '+miss.slice(0,10).join('; '));
const by={};docs.forEach(x=>{const v=x.data();(by[v.studentUid]=by[v.studentUid]||[]).push(v);});const rep={};

for(const [uid,rows] of Object.entries(by)){const out=rows.map(x=>{const ca=x.ca1+x.ca2,t=ca+x.exam;return {subject:x.subject,
ca,exam:x.exam,total:t,grade:grade(t),remark:remark(t)};});rep[uid]={rows:out,average:+(out.reduce((a,b)=>a+b.total,
0)/out.length).toFixed(1)};}
const avgs=Object.values(rep).map(x=>x.average),sorted=[...avgs].sort((a,b)=>b-a),ids=Object.keys(rep),cs=await Promise.all(ids.map(uid=>getDoc(doc(db,
'comments',`${sid}_${d.term}_${uid}`))));
await wb([...ids.map((uid,i)=>b=>b.set(doc(db,'reports',`${uid}_${sid}_${d.term}`),{uid,session:d.session,term:d.term,
classId:d.classId,...rep[uid],mass:cs[i].exists()?(cs[i].data().mass||''):'',position:sorted.indexOf(rep[uid].average)+1,
classSize:avgs.length,lowest:Math.min(...avgs),highest:Math.max(...avgs),publishedAt:Date.now()})),...docs.map(x=>b=>b.update(x.ref,
{status:'published'}))]);
await audit('publish',[d.session,d.term,d.classId].join('/'));return {count:ids.length};}
const COLS=['settings','content','results','reports','comments','attendance','users'];
async function exportAll(){const o={};for(const c of COLS){o[c]={};(await getDocs(collection(db,c))).forEach(d=>o[c][d.id]=d.data());

async function restoreAll(data){const it=[];for(const c of COLS.filter(x=>x!=='users'))for(const [id,v] of Object.entries(data[c]||{
}))it.push(b=>b.set(doc(db,c,id),v));await wb(it);await audit('restoreData',it.length);return {count:it.length}
;}
